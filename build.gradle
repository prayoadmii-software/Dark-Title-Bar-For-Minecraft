plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()

	maven {
		url = "https://maven.fabricmc.net/"
	}
	maven {
		url = "https://repo.polyfrost.org/releases"
	}
	google()

	exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

loom {
	mods {
		"dark-title-bar-for-minecraft" {
			sourceSet sourceSets.main
		}
	}

	runs {
		client {
			runDir "run/client"
			programArg "--username=PrayoadMii"
		}
		server {
			runDir "run/server"
		}
	}
}

dependencies {
	implementation "org.lwjgl:lwjgl-glfw:3.4.3"
	implementation "org.lwjgl:lwjgl-glfw:3.4.3:natives-windows"

	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	
	implementation "net.java.dev.jna:jna:5.14.0"
	implementation "net.java.dev.jna:jna-platform:5.14.0"

	compileOnly "org.polyfrost.oneconfig:config-impl:${oneconfig_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {

	}
}